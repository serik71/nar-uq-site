{{ define "main" }}
<div style="padding: 100px 40px 0;"><a href="javascript:history.back()" style="color:#1a6b6b;text-decoration:none;font-size:0.95rem;">← {{ i18n "back" | default "Назад" }}</a></div>
<article style="padding: 40px 40px 80px; max-width: 1200px; margin: 0 auto;">
    <h1 style="font-family: 'Playfair Display',serif; font-size: 3rem; color: #1a6b6b; margin-bottom: 2rem;">{{ .Title }}</h1>
    <div style="font-size: 1.1rem; line-height: 1.9; color: #343a40;">
        {{ .Content }}
    </div>
</article>
{{ end }}
