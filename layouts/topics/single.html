{{ define "main" }}
<section style="padding: 140px 40px 80px; max-width: 900px; margin: 0 auto;">
    <a href="../" style="font-size: 0.9rem; color: #1a6b6b; text-decoration: none; display: inline-block; margin-bottom: 2rem;">← {{ i18n "topics" | default "Темы" }}</a>
    <h1 style="font-family: 'Playfair Display',serif; font-size: 3rem; color: #1a6b6b; margin-bottom: 2rem;">{{ .Title }}</h1>
    {{ with .Params.articles }}
    <ul style="list-style: none; padding: 0; margin: 0;">
        {{ range . }}
        <li style="border-bottom: 1px solid #e9ecef; padding: 1rem 0; font-size: 1.1rem; color: #343a40;">{{ . }}</li>
        {{ end }}
    </ul>
    {{ end }}
</section>
{{ end }}
