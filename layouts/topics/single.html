{{ define "main" }}
{{ if .IsSection }}
<section style="padding: 140px 40px 80px; max-width: 1200px; margin: 0 auto;">
    <a href="../" style="font-size: 0.9rem; color: #1a6b6b; text-decoration: none; display: inline-block; margin-bottom: 2rem;">← Темы</a>
    <h1 style="font-family: 'Playfair Display',serif; font-size: 3rem; color: #1a6b6b; margin-bottom: 3rem;">{{ .Title }}</h1>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;">
        {{ range .Pages }}
        <a href="{{ .Permalink }}" style="display: block; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 1.5rem; text-decoration: none; transition: all 0.2s;">
            <h2 style="font-family: 'Playfair Display',serif; font-size: 1.4rem; color: #1a6b6b; margin-bottom: 0.5rem;">{{ .Title }}</h2>
        </a>
        {{ end }}
    </div>
</section>
{{ else }}
<article style="padding: 140px 40px 80px; max-width: 900px; margin: 0 auto;">
    <a href="../" style="font-size: 0.9rem; color: #1a6b6b; text-decoration: none; display: inline-block; margin-bottom: 2rem;">← Назад</a>
    <h1 style="font-family: 'Playfair Display',serif; font-size: 3rem; color: #1a6b6b; margin-bottom: 1rem;">{{ .Title }}</h1>
    {{ with .Params.pdf }}
    <a href="{{ . }}" download style="display: inline-block; background: #1a6b6b; color: white; padding: 0.6rem 1.4rem; border-radius: 6px; text-decoration: none; font-size: 0.95rem; margin-bottom: 2rem;">Скачать PDF</a>
    {{ end }}
    <div style="font-size: 1.1rem; line-height: 1.9; color: #343a40;">
        {{ .Content }}
    </div>
    <a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;" style="display: inline-block; margin-top: 3rem; color: #1a6b6b; text-decoration: none; font-size: 0.95rem;">↑ Наверх</a>
</article>
{{ end }}
{{ end }}
