{{ define "main" }}
<style>
.scroll-top-btn {
  position: fixed;
  right: 30px;
  bottom: 30px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #1a6b6b;
  color: #fff;
  border: none;
  font-size: 24px;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  z-index: 1000;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.scroll-top-btn.visible {
  opacity: 1;
  pointer-events: auto;
}
.scroll-top-btn:hover { background: #145555; }
.monograph-content h1 { font-size:1.8rem;color:#1a6b6b;margin-top:2.5rem;margin-bottom:1rem }
.monograph-content h2 { font-size:1.4rem;color:#1a6b6b;margin-top:2rem;margin-bottom:.8rem }
.monograph-content h3 { font-size:1.2rem;color:#1a6b6b;margin-top:1.5rem;margin-bottom:.6rem }
.monograph-content p { margin-bottom:1rem }
.monograph-content ul, .monograph-content ol { margin-bottom:1rem;padding-left:1.5rem }
.monograph-content li { margin-bottom:.4rem }
.monograph-content blockquote { border-left:4px solid #1a6b6b;padding-left:1rem;margin:1rem 0;color:#555;font-style:italic }
.monograph-content table { border-collapse:collapse;margin:1rem 0;width:100% }
.monograph-content th, .monograph-content td { border:1px solid #ddd;padding:.5rem;text-align:left }
.monograph-content th { background:#f5f9f9 }
.monograph-content code { background:#f5f5f5;padding:2px 6px;border-radius:3px;font-size:.9em }
</style>
<div style="padding:100px 40px 0">
  <a href="javascript:history.back()" style="color:#1a6b6b;text-decoration:none;font-size:.95rem">← Назад</a>
</div>
<article style="padding:40px 40px 80px;max-width:900px;margin:0 auto">
  <h1 style="font-family:'Playfair Display',serif;font-size:2.4rem;color:#1a6b6b;margin-bottom:.4rem">
    {{ .Title }}
  </h1>
  {{ with .Params.subtitle }}
  <div style="font-size:1.1rem;color:#666;margin-bottom:1.5rem;font-style:italic">
    {{ . }}
  </div>
  {{ end }}

  {{ with .Params.pdf }}
  <div style="margin:2rem 0;padding:1rem 1.5rem;background:#f5f9f9;border-left:4px solid #1a6b6b;border-radius:4px">
    <a href="{{ . }}" download style="display:inline-block;background:#1a6b6b;color:#fff;padding:.6rem 1.2rem;border-radius:4px;text-decoration:none;font-weight:500">
      📥 Скачать PDF
    </a>
    <span style="margin-left:1rem;color:#666;font-size:.9rem">
      Можно читать ниже или скачать для оффлайн-чтения
    </span>
  </div>
  {{ end }}

  <div class="monograph-content" style="font-size:1.05rem;line-height:1.8;color:#343a40;margin-top:2rem">
    {{ .Content }}
  </div>
</article>

<button class="scroll-top-btn" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Наверх">↑</button>
<script>
(function(){
  var btn = document.getElementById('scrollTopBtn');
  if (!btn) return;
  window.addEventListener('scroll', function(){
    if (window.scrollY > 400) btn.classList.add('visible');
    else btn.classList.remove('visible');
  });
})();
</script>
{{ end }}
