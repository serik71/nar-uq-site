{{ define "main" }}
<div style="padding:100px 40px 0">
  <a href="javascript:history.back()" style="color:#1a6b6b;text-decoration:none;font-size:.95rem">← Назад</a>
</div>
<article style="padding:40px 40px 80px;max-width:1200px;margin:0 auto">
  <h1 style="font-family:'Playfair Display',serif;font-size:3rem;color:#1a6b6b;margin-bottom:2rem">{{ .Title }}</h1>
  {{ .Content }}
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem;margin-top:1.5rem">
    {{ range .RegularPages.ByTitle }}
    <div style="background:#f8f9fa;border:1px solid #e9ecef;border-radius:8px;padding:1.5rem;display:flex;flex-direction:column">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.4rem;color:#1a6b6b;margin-bottom:.5rem">{{ .Title }}</h2>
      {{ with .Params.description }}<p style="color:#555;margin-bottom:1rem">{{ . }}</p>{{ end }}
      <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:auto">
        <a href="{{ .Permalink }}" style="background:#1a6b6b;color:#fff;padding:.5rem 1rem;border-radius:6px;text-decoration:none">Открыть</a>
        {{ with .Params.pdf }}<a href="{{ . }}" target="_blank" rel="noopener" style="background:#fff;color:#1a6b6b;border:1px solid #1a6b6b;padding:.5rem 1rem;border-radius:6px;text-decoration:none">Скачать PDF</a>{{ end }}
      </div>
    </div>
    {{ end }}
  </div>
</article>
{{ end }}
