[wordryDefinition]
other = "Чтение — перевод арабского слова قُرْآن (курʾāн, «коран»). Это отглагольное имя корня ق-ر-أ «читать»: зафиксированное в устном и письменном слове чтение. Перевод сделан по корню, а не калькой «Коран»."

[meaningLabel]
other = "Название"

[meaningTitle]
other = "Что означает NAR-UQ?"

[meaningKK]
other = "«Нар» — символ силы и мощи. «Ұқ» в повелительном наклонении — «понимай». Наоборот читается как Құран."

[meaningRU]
other = "По словарю Даля: свод правил и законов; обет, завет; предписание, правило. Наоборот — «Коран»."

[meaningAR]
other = "Арабское слово. Переводится как «чтение, рецитация, декламация». Мы используем перевод по корню — Чтение."

